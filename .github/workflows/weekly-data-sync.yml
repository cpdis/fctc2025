# Weekly authenticated Google Sheets snapshot of every supported season.
# Historical guest promotion can change earlier years. Capture them together.
# Configure FCTC_ATTENDANCE_ENDPOINT as a repository variable and
# FCTC_ATTENDANCE_SECRET as a repository secret after the v2 script is deployed.
# An unchanged snapshot makes no commit and causes no deployment.

name: Weekly Data Sync

on:
  schedule:
    # Sunday evening local time: the week's runs are logged, sheet is up to date.
    # The off-minute start reduces common schedule congestion.
    # (Note: GitHub may delay scheduled runs under load, and auto-disables the
    #  schedule after 60 days of repo inactivity — use the manual trigger then.)
    - cron: '17 17 * * 0'
      timezone: Australia/Perth
  # Manual trigger for testing / on-demand pulls (and the 60-day fallback).
  workflow_dispatch:
    inputs:
      notification_mode:
        description: Milestone notification mode
        required: true
        default: preview
        type: choice
        options:
          - preview
          - send
          - smoke

# Jobs opt in to only the access they need.
permissions:
  contents: read

# Queue scheduled and manual syncs. Never cancel a data push or email request.
concurrency:
  group: weekly-data-sync
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up snapshot runtime
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Fetch + validate all supported seasons
        run: node scripts/sync-attendance-snapshot.js
        env:
          FCTC_ATTENDANCE_ENDPOINT: ${{ vars.FCTC_ATTENDANCE_ENDPOINT }}
          FCTC_ATTENDANCE_SECRET: ${{ secrets.FCTC_ATTENDANCE_SECRET }}

      - name: Commit + push if changed
        run: |
          # The snapshot client writes the timestamp only when CSV data changes.
          if git diff --quiet -- public/data; then
            echo "No attendance changes; nothing to commit."
            exit 0
          fi
          git config user.name "fctc-data-bot"
          git config user.email "fctc-data-bot@users.noreply.github.com"
          git add 'public/data/*.csv' public/data/last-updated.json
          git commit -m "chore(data): sync all attendance seasons"
          git push

  notify:
    needs: sync
    if: >-
      success() &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: milestone-production
    permissions:
      contents: read
    steps:
      # Sync can push a new commit, so read the latest main branch state.
      - name: Checkout latest main
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install notification dependencies
        run: npm ci --omit=dev --ignore-scripts

      # Detection receives no provider credentials or recipient configuration.
      - name: Preview milestone notifications
        id: milestones
        run: node scripts/send-milestone-digest.js --preview

      - name: Report disabled delivery
        if: >-
          (
            (github.event_name == 'schedule' && github.run_attempt == 1) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.notification_mode == 'send'
            )
          ) &&
          vars.MILESTONE_EMAIL_ENABLED != 'true'
        run: echo "milestone_notification delivery=disabled"

      - name: Report skipped scheduled rerun
        if: github.event_name == 'schedule' && github.run_attempt != 1
        run: echo "milestone_notification delivery=skipped reason=scheduled-rerun"

      - name: Report refused manual delivery
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.notification_mode == 'send' &&
          vars.MILESTONE_EMAIL_ENABLED == 'true' &&
          (github.actor != 'cpdis' || github.triggering_actor != 'cpdis')
        run: echo "milestone_notification delivery=refused reason=unauthorized"

      - name: Send milestone notifications
        if: >-
          vars.MILESTONE_EMAIL_ENABLED == 'true' &&
          steps.milestones.outputs.has_candidates == 'true' &&
          (
            (github.event_name == 'schedule' && github.run_attempt == 1) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.notification_mode == 'send' &&
              github.ref == 'refs/heads/main' &&
              github.actor == 'cpdis' &&
              github.triggering_actor == 'cpdis'
            )
          )
        run: node scripts/send-milestone-digest.js --send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MILESTONE_RECIPIENTS: ${{ secrets.MILESTONE_RECIPIENTS }}
          MILESTONE_FROM: FCTC Delivery Service <runs@notifications.fctc.cpd.dev>

      - name: Send milestone smoke test
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.notification_mode == 'smoke' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'cpdis' &&
          github.triggering_actor == 'cpdis'
        run: node scripts/send-milestone-digest.js --smoke
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MILESTONE_SMOKE_RECIPIENT: ${{ secrets.MILESTONE_SMOKE_RECIPIENT }}
          MILESTONE_FROM: FCTC Delivery Service <runs@notifications.fctc.cpd.dev>
