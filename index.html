<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/fctc_logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FCTC | Filament Coffee Track Club</title>

    <!-- No-flash theme, the same rule as fctc.fun (fctc-site Base.astro): the
         saved choice in localStorage.theme, else the OS preference. It runs
         inline before the app loads, so the first paint is already in the
         right theme. The site header's toggle writes the same key, so one
         choice holds across the hub and the dashboard (KTD7). Reading storage
         can throw (Safari private mode, blocked site data); then the OS
         preference decides. -->
    <script>
      (() => {
        let saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch {}
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fctc.fun/" />
    <meta property="og:title" content="FCTC | Filament Coffee Track Club" />
    <meta property="og:description" content="Filament Coffee Track Club run stats and Wrapped" />
    <meta property="og:image" content="https://fctc.fun/fctc_logo.jpeg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fctc.fun/" />
    <meta name="twitter:title" content="FCTC | Filament Coffee Track Club" />
    <meta name="twitter:description" content="Filament Coffee Track Club run stats and Wrapped" />
    <meta name="twitter:image" content="https://fctc.fun/fctc_logo.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
